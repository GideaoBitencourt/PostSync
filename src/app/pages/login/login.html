<body>

    <main class="login-container">

        <!-- Lado esquerdo -->
        <section class="login-banner">
            <div class="banner-text">
                <h1>post<span>Sync</span></h1>
                <p>Sincronize sua operação em um só<br>lugar.</p>
            </div>
        </section>

        <!-- Lado direito -->
        <section class="login-form">

            <div class="form-content">

                <h2>Entrar</h2>
                <p class="subtitle">Acesse sua conta postSync</p>

                <form>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="voce@empresa.com"
                        >
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            placeholder="••••••••"
                        >
                    </div>

                    <a href="#" class="forgot-password">
                        Esqueceu sua senha?
                    </a>

                    <button type="submit" class="btn-entrar">
                        Entrar
                    </button>

                </form>

                <div class="divider">
                    <span></span>
                    <p>ou</p>
                    <span></span>
                </div>

                <button class="btn-cadastrar">
                    Cadastrar conta
                </button>

            </div>

        </section>

    </main>

</body>
