<body>

    <main class="cadastro-container">

        <!-- Lado esquerdo -->
        <section class="cadastro-banner">

            <div class="banner-text">

                <h1>post<span>Sync</span></h1>

                <p>
                    Sincronize sua operação em um só<br>
                    lugar.
                </p>

            </div>

        </section>


        <!-- Lado direito -->
        <section class="cadastro-form">

            <div class="form-content">

                <h2>Cadastrar</h2>

                <p class="subtitle">
                    Crie sua conta postSync
                </p>


                <form>

                    <!-- Nome -->
                    <div class="input-group">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome completo"
                        >

                    </div>


                    <!-- Email -->
                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="voce@empresa.com"
                        >

                    </div>


                    <!-- Senha -->
                    <div class="input-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                        >

                    </div>


                    <!-- Confirmar senha -->
                    <div class="input-group">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar-senha"
                            placeholder="Confirme sua senha"
                        >

                    </div>


                    <!-- Botão -->
                    <button
                        type="submit"
                        class="btn-cadastrar"
                    >
                        Cadastrar
                    </button>

                </form>


                <!-- Login -->
                <p class="login-link">
                    Já possui uma conta?

                    <a href="http://localhost:4200/#">
                        Entrar
                    </a>
                </p>

            </div>

        </section>

    </main>

</body>
