<div class="carousel" (mouseenter)="stopAutoplay()" (mouseleave)="startAutoplay()">

  <div class="carousel-track" *ngIf="images.length">
    <div
      class="carousel-slide"
      *ngFor="let img of images; let i = index"
      [class.active]="i === currentIndex"
    >
      <img [src]="img.src" [alt]="img.alt || ''" />
      <div class="carousel-caption" *ngIf="img.caption">{{ img.caption }}</div>
    </div>
  </div>

  <button
    type="button"
    class="carousel-arrow arrow-prev"
    (click)="prev()"
    aria-label="Imagem anterior"
    *ngIf="images.length > 1"
  >‹</button>

  <button
    type="button"
    class="carousel-arrow arrow-next"
    (click)="next()"
    aria-label="Próxima imagem"
    *ngIf="images.length > 1"
  >›</button>

  <div class="carousel-dots" *ngIf="images.length > 1">
    <button
      type="button"
      *ngFor="let img of images; let i = index"
      class="dot"
      [class.active]="i === currentIndex"
      (click)="goTo(i)"
      [attr.aria-label]="'Ir para imagem ' + (i + 1)"
    ></button>
  </div>

</div>
